<title id="title">Six complementary research directions in software interaction quality</title>
<desc id="desc">Six equally sized peer research directions in two columns and three rows. The shared framework connects Agents for Software Quality with Software Engineering for Agent Quality, with Software Interaction as the object, Trustworthiness as the goal, Security and Control as the constraint, and Intelligent Execution as the capability. Seven labeled arrows describe complementary contributions among the directions.</desc>
