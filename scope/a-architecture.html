<title id="title">Trustworthy interaction: reciprocal quality research</title>
<desc id="desc">A security constraint encloses a human, agent, and software interaction. Software interaction quality assurance supports trustworthiness. Intelligent execution is a capability. Runtime assurance, quality engineering and human–agent collaboration connect directly to the interaction. Equal opposing arrows state the reciprocal research positioning.</desc>
